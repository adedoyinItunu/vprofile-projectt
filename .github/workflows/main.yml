name: vProfile CI/CD Pipeline

on:
push:
branches: [ main ]
workflow_dispatch:

jobs:
test:
name: Test the Pipeline
runs-on: ubuntu-latest
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'corretto'

  - name: Build with Maven
    run: mvn install -DskipTests

  - name: Verify artifact was created
    run: ls -la target/*.war

  - name: Run tests
    run: mvn test
```

deploy:
name: Deploy to Beanstalk
runs-on: ubuntu-latest
needs: test

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Build artifact
    run: mvn install -DskipTests

  - name: Deploy to Elastic Beanstalk
    uses: einaregilsson/beanstalk-deploy@v21
    with:
      application_name: ${{ secrets.EB_APPLICATION_NAME }}
      environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
      version_label: vprofile-${{ github.sha }}
      region: ${{ secrets.AWS_REGION }}
      existing_bucket_name: ${{ secrets.S3_BUCKET }}
      aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      deployment_package: target/vprofile-v2.war

  - name: Deployment complete
    run: echo "Deployment successful"
